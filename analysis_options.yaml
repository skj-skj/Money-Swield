# Analyzer and lint settings. Run `flutter analyze`; it must report nothing.
# Rule reference: https://dart.dev/tools/linter-rules/all

# Dart's recommended rules plus the Flutter-specific ones.
include: package:flutter_lints/flutter.yaml

# The standard `dart format` style, written out so an editor's own
# line-length setting can't format the project differently.
formatter:
  page_width: 80

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  # No silent `dynamic`: implicit downcasts, untyped inference and raw
  # generic types (`List` instead of `List<int>`) become errors.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# Rules added on top of flutter_lints. Left out on purpose:
# - prefer_const_constructors and friends: noisy, and the Flutter team
#   dropped them from its own set.
# - require_trailing_commas, lines_longer_than_80_chars: the formatter
#   decides this.
# - avoid_positional_boolean_parameters: the specs define
#   `setArchived(int id, bool archived)` on purpose.
# - avoid_catches_without_on_clauses: catch-all handlers that show "Couldn't
#   save" or an error report are deliberate.
# - discarded_futures, cascade_invocations, public_member_api_docs: more
#   noise than value in an app.
# - avoid_slow_async_io: it asks for synchronous dart:io calls, which would
#   block the UI thread (e.g. while the migration backup copies the file).
# - unnecessary_await_in_return: deprecated.
# - avoid_redundant_argument_values: explicit values such as
#   `DateTime.utc(2026, 9, 1)` or a test's `deviceCurrency: 'INR'` read better.
linter:
  rules:
    # Bugs and data safety.
    avoid_catching_errors: true
    avoid_dynamic_calls: true
    avoid_type_to_string: true
    avoid_unused_constructor_parameters: true
    avoid_void_async: true
    cancel_subscriptions: true
    cast_nullable_to_non_nullable: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true

    # Clear APIs and docs.
    always_declare_return_types: true
    comment_references: true
    deprecated_consistency: true
    document_ignores: true
    strict_top_level_inference: true
    type_annotate_public_apis: true
    unnecessary_ignore: true
    use_enums: true

    # Readable, consistent code.
    avoid_bool_literals_in_conditional_expressions: true
    avoid_multiple_declarations_per_line: true
    directives_ordering: true
    eol_at_end_of_file: true
    missing_whitespace_between_adjacent_strings: true
    no_literal_bool_comparisons: true
    noop_primitive_operations: true
    omit_obvious_local_variable_types: true
    parameter_assignments: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    prefer_null_aware_method_calls: true
    prefer_single_quotes: true
    simplify_variable_pattern: true
    sort_pub_dependencies: true
    unnecessary_breaks: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    use_null_aware_elements: true
    use_string_buffers: true

    # Flutter widgets.
    sized_box_shrink_expand: true
    use_colored_box: true
    use_decorated_box: true
