# Builds the GitHub release from main, run by hand (Actions → Release →
# Run workflow). Every step is a make target or scripts/release.py, so
# `make release` does the same on a dev machine.
#
# Publishing pushes two commits to main (CHANGELOG.md released, then a new
# unreleased section) and the tag; see scripts/release.py.
#
# Needs the GitHub environment `release` with these secrets:
#   ANDROID_KEYSTORE_BASE64   the release keystore, base64-encoded
#   ANDROID_STORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; keep the APKs as a workflow artifact, no commit, tag or release
        type: boolean
        default: false

# Two releases at once could both pass the "tag is new" check.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 60
    steps:
      # Full history and tags: the version check compares with the last
      # release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # First, before anything slow: is this a new version with its
      # changelog?
      - name: Check version and changelog
        id: check
        run: make release-check

      - name: Only main is released
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases are made from main, not ${GITHUB_REF}."
          exit 1

      # The JDK that runs Gradle, javac and kotlinc: 21, the same as the dev
      # machine (Android Studio's bundled JDK, which `flutter build` uses).
      # The compiled code still targets Java 17, set in
      # android/app/build.gradle.kts, whatever JDK builds it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Same Flutter as the dev machine; raise it together with local.
      # F-Droid's recipe reads its Flutter version from the line below (the
      # only one of its kind in this file), so a Flutter upgrade needs no
      # recipe change. Keep the value a plain x.y.z.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # F-Droid rebuilds the foss APKs from source and publishes these
      # signed ones only when its build is byte-identical (reproducible
      # builds; its recipe in fdroiddata repeats this step). Two things
      # would otherwise differ between machines:
      # - the pub cache path: kept inside the checkout, which F-Droid
      #   builds at this same path (/home/runner/work/Money-Swield/...);
      # - jni's native library: its linker build-id hashes the NDK and pub
      #   cache paths, so it is linked without one.
      # APKs for F-Droid therefore come from this workflow only, never from
      # `make release` on a dev machine.
      - name: Reproducible build setup
        run: |
          export PUB_CACHE="$GITHUB_WORKSPACE/.pub-cache"
          echo "PUB_CACHE=$PUB_CACHE" >> "$GITHUB_ENV"
          flutter pub get --enforce-lockfile
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
          # Fails if a jni update changed its CMake file and the edit missed.
          grep -q -- '--build-id=none' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: make release-signing

      - name: Build APKs
        run: make github

      - name: Release notes
        run: make release-notes

      # Kept on every run, so a release whose last step fails can still be
      # finished by hand with these files.
      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.check.outputs.version }}
          path: build/dist/
          retention-days: 7

      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          make release-publish
